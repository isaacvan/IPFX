<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reset your password | IPFX Capital</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/desktop/build/icon.png" sizes="any">
    <link rel="stylesheet" href="/assets/css/site-foundation.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0a0a0c; --fg:#ffffff; --muted:#a0a0a0; --line:#2a2a2c; --cobalt:#2563eb; --success:#10b981; --error:#ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; color: var(--fg); background: var(--bg);
               min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 440px; background: rgba(255,255,255,0.02); border: 1px solid var(--line);
                border-radius: 12px; padding: 2.5rem 2rem; }
        .logo { display: flex; align-items: center; gap: .6rem; justify-content: center; margin-bottom: 1.5rem; color: var(--fg); text-decoration: none; }
        .logo img { width: 32px; height: 32px; }
        .logo span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; text-align: center; margin-bottom: .5rem; }
        .sub { color: var(--muted); text-align: center; font-size: .92rem; line-height: 1.5; margin-bottom: 1.6rem; }
        label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .45rem; }
        input { width: 100%; padding: 13px 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
                border-radius: 10px; color: var(--fg); font-size: 1rem; margin-bottom: 1rem; font-family: inherit; }
        input:focus { outline: none; border-color: var(--cobalt); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button { width: 100%; padding: 14px; border: 0; border-radius: 980px; background: var(--cobalt); color: #fff;
                 font-weight: 600; font-size: 1rem; cursor: pointer; font-family: inherit; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .msg { display: none; margin-top: 1rem; font-size: .88rem; line-height: 1.5; text-align: center; }
        .hint { color: var(--muted); font-size: .78rem; margin: -.5rem 0 1rem; }
        .back { display: block; text-align: center; margin-top: 1.4rem; color: var(--muted); font-size: .88rem; text-decoration: none; }
        .back:hover { color: var(--cobalt); }
    </style>
</head>
<body>
    <main class="card" role="main">
        <a href="/" class="logo"><img src="/desktop/build/icon.png" alt=""><span>IPFX Capital</span></a>
        <h1>Choose a new password</h1>
        <p class="sub" id="sub">Checking your reset link…</p>

        <form id="resetForm" style="display:none" novalidate>
            <label for="pw">New password</label>
            <input type="password" id="pw" autocomplete="new-password" minlength="8" required>
            <p class="hint">At least 8 characters.</p>
            <label for="pw2">Confirm new password</label>
            <input type="password" id="pw2" autocomplete="new-password" minlength="8" required>
            <button type="submit" id="saveBtn">Save new password</button>
        </form>

        <p class="msg" id="msg" role="status"></p>
        <a class="back" href="/login.html">Back to login</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script>
    (function () {
        const sb = window.supabase.createClient(
            'https://agulweemteoeagscmppy.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFndWx3ZWVtdGVvZWFnc2NtcHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MzU0ODIsImV4cCI6MjA4MTQxMTQ4Mn0.I70jN5DCuCn8OtISqvTRzuzGFaYd2pV8vviEED6gFlQ'
        );
        const form = document.getElementById('resetForm');
        const sub = document.getElementById('sub');
        const msg = document.getElementById('msg');
        const show = (text, colour) => { msg.style.display = 'block'; msg.style.color = colour; msg.textContent = text; };
        let ready = false;

        function allowReset() {
            if (ready) return;
            ready = true;
            sub.textContent = 'Enter a new password for your IPFX account.';
            form.style.display = 'block';
            document.getElementById('pw').focus();
        }

        // supabase-js reads the one-time recovery token from the link and
        // signs the user in for this purpose only.
        sb.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) allowReset();
        });
        setTimeout(async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) { allowReset(); return; }
            if (!ready) {
                sub.textContent = 'This reset link is invalid or has expired.';
                show('Go back to login and click "Forgot password?" to get a new link.', '#f59e0b');
            }
        }, 1800);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('pw').value;
            const pw2 = document.getElementById('pw2').value;
            if (pw.length < 8) { show('Your password must be at least 8 characters.', '#f59e0b'); return; }
            if (pw !== pw2) { show('The two passwords do not match.', '#f59e0b'); return; }
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = 'Saving…';
            const { error } = await sb.auth.updateUser({ password: pw });
            if (error) {
                btn.disabled = false; btn.textContent = 'Save new password';
                show(/same|different/i.test(error.message) ? 'Choose a password you have not used before.' : 'Could not save your password: ' + error.message, '#ef4444');
                return;
            }
            form.style.display = 'none';
            sub.textContent = 'Your password has been changed.';
            show('Taking you to login…', '#10b981');
            await sb.auth.signOut();
            setTimeout(() => { location.href = '/login.html'; }, 1600);
        });
    })();
    </script>
    <script defer src="/assets/js/site-foundation.js"></script>
</body>
</html>
