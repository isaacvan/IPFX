name: IPFX Markets Desktop
on:
  workflow_dispatch:
    inputs:
      preview:
        description: Build unsigned internal previews only
        type: boolean
        default: true
  push:
    branches:
      - codex/desktop-preview-build
permissions:
  contents: read
  id-token: write
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build unsigned preview
        if: github.event_name == 'push' || inputs.preview
        run: npm run dist:${{ matrix.target }}:preview
      - name: Build signed candidate
        if: github.event_name == 'workflow_dispatch' && !inputs.preview
        run: npm run dist:${{ matrix.target }}
      - name: Transfer preview to private Supabase Storage
        if: github.event_name == 'push'
        run: node scripts/upload-preview-to-supabase.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ipfx-markets-${{ matrix.target }}-${{ (github.event_name == 'push' || inputs.preview) && 'UNSIGNED-PREVIEW' || 'signed-candidate' }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
