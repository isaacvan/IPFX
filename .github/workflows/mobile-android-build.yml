name: IPFX Markets Android app
# Builds a test .apk in the cloud (GitHub's Android runner, whose SDK licences GitHub has already accepted).
# It runs only when started by hand from the Actions tab, or on a push to a mobile/* branch.
# The app file is attached to the run as "IPFX-Markets-android"; nothing is published to any store or website.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: bundled = pages inside the app (before the website is published); live = opens ipfxcapital.com
        type: choice
        options: [bundled, live]
        default: bundled
  push:
    branches:
      - 'mobile/**'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/copy-web.mjs
        env:
          IPFX_APP_MODE: ${{ github.event.inputs.mode || 'bundled' }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IPFX-Markets-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
