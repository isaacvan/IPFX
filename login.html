    <style>
        /* Sign-in page, modelled on Apple's account sign-in: a slim header, no
           card, one joined field group with floating labels, and a round
           arrow button inside the last field. */
        :root {
            --bg: #0a0a0c;
            --fg: #f5f5f7;
            --muted: #a1a1a6;
            --faint: #6e6e73;
            --field: #1c1c1e;
            --field-line: #3a3a3c;
            --link: #4d8dff;
            --cobalt: #2563eb;
            --danger: #ff453a;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 4px; }

        /* ---- header ---- */
        .auth-header { border-bottom: 1px solid rgba(255,255,255,0.08); }
        .auth-header-inner {
            max-width: 980px;
            height: 52px;
            margin: 0 auto;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
        .brand:hover { text-decoration: none; opacity: 0.85; }
        .brand img { width: 24px; height: 24px; border-radius: 6px; }
        .header-links { display: flex; align-items: center; gap: 22px; font-size: 13px; }
        .header-links a { color: var(--muted); }
        .header-links a:hover { color: var(--fg); text-decoration: none; }

        /* ---- main column ---- */
        .auth-main { flex: 1; display: flex; justify-content: center; padding: 11vh 22px 64px; }
        .auth-column { width: 100%; max-width: 460px; text-align: center; }
        .auth-mark { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 22px; display: block; }
        h1 { font-size: 32px; line-height: 1.125; font-weight: 600; letter-spacing: -0.025em; }
        .subtitle { margin-top: 10px; font-size: 17px; line-height: 1.47; color: var(--muted); }

        /* ---- joined field group with floating labels ---- */
        form { margin-top: 36px; }
        .field-group {
            border: 1px solid var(--field-line);
            border-radius: 12px;
            background: var(--field);
            overflow: hidden;
            text-align: left;
            transition: border-color .2s, box-shadow .2s;
        }
        .field-group:focus-within { border-color: var(--cobalt); box-shadow: 0 0 0 4px rgba(37,99,235,0.22); }
        .field-group.has-error { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(255,69,58,0.16); }
        .field { position: relative; }
        .field + .field { border-top: 1px solid var(--field-line); }
        .field input {
            width: 100%;
            height: 56px;
            padding: 22px 16px 6px;
            border: 0;
            background: transparent;
            color: var(--fg);
            font: 400 17px/1.2 var(--font);
            letter-spacing: -0.01em;
            outline: none;
        }
        .field input::placeholder { color: transparent; }
        .field label {
            position: absolute;
            left: 16px;
            top: 18px;
            font-size: 17px;
            color: var(--faint);
            pointer-events: none;
            transform-origin: left top;
            transition: transform .18s ease, color .18s ease;
        }
        .field input:focus + label,
        .field input:not(:placeholder-shown) + label { transform: translateY(-10px) scale(0.7); color: var(--muted); }
        .field-password input { padding-right: 60px; }
        /* autofill: keep the dark field instead of the browser's yellow/blue */
        .field input:-webkit-autofill {
            -webkit-text-fill-color: var(--fg);
            -webkit-box-shadow: 0 0 0 100px var(--field) inset;
            caret-color: var(--fg);
        }

        .btn-go {
            position: absolute;
            right: 12px;
            top: 50%;
            width: 32px;
            height: 32px;
            margin-top: -16px;
            display: grid;
            place-items: center;
            border: 1.5px solid var(--faint);
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
            transition: border-color .2s, color .2s, background .2s;
        }
        .btn-go svg { width: 14px; height: 14px; }
        .btn-go.ready { border-color: var(--fg); color: var(--fg); }
        .btn-go.ready:hover { background: rgba(255,255,255,0.08); }
        .btn-go .spin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--fg); animation: spin .7s linear infinite; }
        .btn-go.is-loading { border-color: transparent; cursor: progress; }
        .btn-go.is-loading svg { display: none; }
        .btn-go.is-loading .spin { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- messages ---- */
        .auth-error { display: none; margin-top: 14px; text-align: left; font-size: 14px; line-height: 1.45; color: var(--danger); }
        .auth-error p { display: flex; gap: 8px; }
        .auth-error p::before { content: "!"; flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: var(--danger); color: #fff; font: 700 11px/16px var(--font); text-align: center; }
        .link-btn { margin: 8px 0 0 24px; padding: 0; border: 0; background: none; color: var(--link); font: 500 14px var(--font); cursor: pointer; }
        .link-btn:hover:not(:disabled) { text-decoration: underline; }
        .link-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #forgotMsg { margin-top: 10px; font-size: 13px; line-height: 1.5; }

        .auth-links { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; }
        .auth-links .muted { color: var(--muted); }
        .secure-note { margin-top: 44px; font-size: 12px; line-height: 1.5; color: var(--faint); }

        /* ---- footer (shared markup, restyled quietly) ---- */
        .ipfx-launch-footer {
            max-width: 980px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 22px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 0;
            background: transparent;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: var(--faint);
            font: 400 12px/1.4 var(--font);
        }
        .ipfx-launch-footer > span { margin-right: auto; padding-right: 16px; }
        .ipfx-launch-footer a { color: var(--muted); padding: 0 10px; border-left: 1px solid rgba(255,255,255,0.14); }
        .ipfx-launch-footer > span + a { border-left: 0; }
        .ipfx-launch-footer a:hover { color: var(--fg); text-decoration: none; }
        .ipfx-launch-footer .ipfx-cookie-preferences {
            min-height: 0;
            padding: 0 0 0 10px;
            border: 0;
            border-left: 1px solid rgba(255,255,255,0.14);
            border-radius: 0;
            background: none;
            color: var(--muted);
            font: 400 12px/1.4 var(--font);
        }
        .ipfx-launch-footer .ipfx-cookie-preferences:hover { color: var(--fg); }

        /* keep the whole page on screen in short windows (the desktop app) */
        @media (max-height: 760px) {
            .auth-main { padding: 5vh 22px 32px; }
            .auth-mark { width: 52px; height: 52px; border-radius: 13px; margin-bottom: 16px; }
            h1 { font-size: 28px; }
            form { margin-top: 26px; }
            .auth-links { margin-top: 22px; gap: 10px; }
            .secure-note { margin-top: 26px; }
        }
        /* leave room for the support chat bubble in the bottom-right corner */
        @media (max-width: 1180px) { .ipfx-launch-footer { padding-right: 96px; } }
        @media (max-width: 520px) {
            .auth-main { padding-top: 7vh; }
            h1 { font-size: 28px; }
            .header-links a.optional { display: none; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

<body style="visibility:hidden">

</header>

<main class="auth-main">
    <div class="auth-column">
        <img class="auth-mark" src="/desktop/build/icon.png" alt="IPFX Capital">
        <h1>Sign in to IPFX</h1>
        <p class="subtitle">Your trader dashboard and IPFX Markets.</p>

        <form id="loginForm" novalidate>
            <div class="field-group" id="fieldGroup">
                <div class="field">
                    <input type="email" id="email" name="email" placeholder=" " autocomplete="username" autocapitalize="off" spellcheck="false" required>
                    <label for="email">Email address</label>
                </div>
                <div class="field field-password">
                    <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required>
                    <label for="password">Password</label>
                    <button type="submit" class="btn-go" id="loginBtn" aria-label="Sign in">
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
                        <span class="spin" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <div id="errorMessage" class="auth-error" role="alert">
                <p id="errorText"></p>
                <button type="button" id="resendBtn" class="link-btn" style="display: none;">Resend confirmation email</button>
            </div>
        </form>

        <div class="auth-links">
            <div>
                <a href="#" id="forgotLink">Forgot password?</a>
                <div id="forgotMsg" role="status" style="display:none"></div>
            </div>
            <div><span class="muted">Don't have an account?</span> <a href="signup.html">Create one now</a></div>
        </div>

        <p class="secure-note">Your sign-in is encrypted. IPFX will never ask for your password by email or chat.</p>
    </div>
</main>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://agulweemteoeagscmppy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFndWx3ZWVtdGVvZWFnc2NtcHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MzU0ODIsImV4cCI6MjA4MTQxMTQ4Mn0.I70jN5DCuCn8OtISqvTRzuzGFaYd2pV8vviEED6gFlQ';
        const supabaseClient = window.supabase?.createClient
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null;
        const requestedNext = new URLSearchParams(location.search).get('next') || '/dashboard.html';
        const safeNext = requestedNext.startsWith('/') && !requestedNext.startsWith('//')
            ? requestedNext : '/dashboard.html';
        document.querySelectorAll('a[href="signup.html"]').forEach(a => {
            a.href = 'signup.html?next=' + encodeURIComponent(safeNext);
        });

        // ============================================
        // AUTO-REDIRECT IF ALREADY LOGGED IN
        // ============================================
        // Check actual Supabase session — not stale localStorage keys
        (async function checkExistingSession() {
            try {
                if (!supabaseClient) throw new Error('The secure sign-in service did not load. Check your internet connection and try again.');
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) { window.location.replace(safeNext); return; }
            } catch(e) {}
            document.body.style.visibility = 'visible';
        })();

        window.addEventListener('pageshow', function(e){
            if(e.persisted){
                document.body.style.visibility = 'hidden';
                if (!supabaseClient) { document.body.style.visibility = 'visible'; return; }
                supabaseClient.auth.getSession().then(function(r){
                    if(r.data.session) window.location.replace(safeNext);
                    else document.body.style.visibility = 'visible';
                }).catch(function(){ document.body.style.visibility = 'visible'; });
            }
        });

        // ============================================
        // LOGIN FORM HANDLER
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Disable button and show loading state
            if (!email || !password) {
                (email ? document.getElementById('password') : document.getElementById('email')).focus();
                return;
            }
            submitBtn.disabled = true;
            submitBtn.classList.add('is-loading');
            submitBtn.setAttribute('aria-label', 'Signing in…');

            try {
                if (!supabaseClient) throw new Error('The secure sign-in service did not load. Check your internet connection and try again.');
                const signIn = supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                const timeout = new Promise((_, reject) => setTimeout(
                    () => reject(new Error('Sign-in timed out. Check your internet connection and try again.')),
                    12000
                ));
                const { data, error } = await Promise.race([signIn, timeout]);

                if (error) throw error;

                // Store authentication token and user data
                localStorage.setItem('ipfx_auth_token', data.session.access_token);
                sessionStorage.setItem('ipfx_user_session', 'active');

                // Store user data for the trading platform
                const userData = {
                    email: data.user.email,
                    name: data.user.user_metadata?.name || data.user.email.split('@')[0],
                    balance: 5000.00, // Default starting balance
                    equity: 5000.00,
                    margin: 0,
                    freeMargin: 5000.00,
                    pnl: 0
                };
                localStorage.setItem('ipfx_user_data', JSON.stringify(userData));

                // Login successful - redirect to dashboard
                window.location.href = safeNext;

            } catch (error) {
                console.error('Login error:', error);
                console.error('Error details:', JSON.stringify(error));

                // Show error message
                const errorMessage = document.getElementById('errorMessage');
                const errorText = document.getElementById('errorText');
                const resendBtn = document.getElementById('resendBtn');

                errorMessage.style.display = 'block';
                document.getElementById('fieldGroup').classList.add('has-error');

                // Check if error is due to unconfirmed email
                const errorStr = error.message ? error.message.toLowerCase() : '';
                const isEmailNotConfirmed =
                    errorStr.includes('email not confirmed') ||
                    errorStr.includes('email_not_confirmed') ||
                    errorStr.includes('email confirmation required');

                if (isEmailNotConfirmed) {
                    errorText.textContent = 'Your email address has not been confirmed yet. Please check your inbox and click the confirmation link, or request a new one below.';
                    resendBtn.style.display = 'inline-block';
                } else {
                    errorText.textContent = /invalid login credentials/i.test(errorStr)
                        ? 'The email or password is incorrect.'
                        : 'Login failed: ' + (error.message || 'Please try again.');
                    resendBtn.style.display = 'none';
                }

                submitBtn.disabled = false;
                submitBtn.classList.remove('is-loading');
                submitBtn.setAttribute('aria-label', 'Sign in');
            }
        });

        // ============================================
        // RESEND CONFIRMATION EMAIL
        // ============================================
        document.getElementById('resendBtn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            const resendBtn = document.getElementById('resendBtn');
            const originalText = resendBtn.textContent;

            if (!email) {
                alert('Please enter your email address');
                return;
            }

            // Disable button and show loading state
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            try {
                const { error } = await supabaseClient.auth.resend({
                    type: 'signup',
                    email: email
                });

                if (error) throw error;

                // Show success message
                document.getElementById('errorText').textContent = 'Confirmation email sent! Please check your inbox and spam folder.';
                resendBtn.style.display = 'none';

                // Re-enable button after delay
                setTimeout(() => {
                    resendBtn.disabled = false;
                    resendBtn.textContent = originalText;
                }, 3000);

            } catch (error) {
                console.error('Resend error:', error);
                alert('Failed to resend email: ' + error.message);

                // Re-enable button
                resendBtn.disabled = false;
                resendBtn.textContent = originalText;
            }
        });
    </script>

    <script>
    // Arrow button lights up once both fields have something in them; typing
    // again clears the error state.
    (function() {
        var email = document.getElementById('email');
        var password = document.getElementById('password');
        var btn = document.getElementById('loginBtn');
        var group = document.getElementById('fieldGroup');
        function sync() { btn.classList.toggle('ready', !!(email.value && password.value)); }
        [email, password].forEach(function(el) {
            el.addEventListener('input', function() { sync(); group.classList.remove('has-error'); });
        });
        // browsers may autofill after load without firing input
        setTimeout(sync, 400);
        sync();
    })();
    </script>

<script>
// Password reset: emails a link that opens reset-password.html. The message
// is the same whether or not the address has an account, so the form can't
// be used to discover who is registered.
(function(){
  const link=document.getElementById('forgotLink'), msg=document.getElementById('forgotMsg');
  if(!link||!msg) return;
  const show=(t,c)=>{msg.style.display='block';msg.style.color=c;msg.textContent=t;};
  link.addEventListener('click', async (e)=>{
    e.preventDefault();
    const email=(document.getElementById('email').value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      show('Enter your email address above, then click "Forgot password?" again.','#f59e0b');
      document.getElementById('email').focus(); return;
    }
    if(typeof supabaseClient==='undefined'||!supabaseClient){show('Password reset is unavailable right now — please refresh and try again.','#ef4444');return;}
    link.style.pointerEvents='none'; show('Sending reset link…','#a0a0a0');
    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});
    link.style.pointerEvents='';
    if(error&&/rate|seconds/i.test(error.message)) show('Please wait a minute before requesting another reset link.','#f59e0b');
    else show('If an account exists for '+email+', a password reset link is on its way. Check your inbox and spam folder.','#10b981');
  });
})();
</script>
