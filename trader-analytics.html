<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Analytics · IPFX Capital</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="/desktop/build/icon.png"><link rel="stylesheet" href="/assets/css/site-foundation.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0c;--panel:#111114;--panel2:#17171b;--line:#28282e;--fg:#f7f7f8;--muted:#959aa4;--blue:#3867ef;--green:#33d39f;--red:#ff6262;--amber:#f2b84b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:15px 24px;border-bottom:1px solid var(--line);background:rgba(10,10,12,.92);backdrop-filter:blur(12px)}h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.btn,.chip,select,input{font:inherit}.btn,.chip{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:9px;padding:8px 12px;cursor:pointer;text-decoration:none}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn:disabled{opacity:.55;cursor:wait}.wrap{max-width:1480px;margin:auto;padding:22px}.tiles{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px;margin-bottom:18px}.tile,.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px}.tile{padding:14px}.tile b{display:block;font-size:24px;margin-top:4px}.k{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:var(--muted);font-weight:700}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 14px}.toolbar input{min-width:250px;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:#fff;padding:10px 12px}.chip.on{background:var(--blue);border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:11px}.card{padding:15px;cursor:pointer;transition:.15s}.card:hover{border-color:#4c74ec;transform:translateY(-1px)}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:15px;font-weight:750}.muted{color:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.badge{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;border-radius:999px;padding:4px 8px;background:#22242a}.badge.scalper{color:#8dc0ff}.badge.news_event_trader{color:var(--amber)}.badge.swing_trader{color:#c5a7ff}.badge.high_frequency_trader{color:#ff8fd1}.badge.unclassified{color:var(--muted)}.pnl{font-size:25px;font-weight:750;margin:14px 0}.pos{color:var(--green)}.neg{color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:11px}.kpis span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase}.kpis b{font-size:13px}.risk{margin-top:11px;padding:9px 10px;border-radius:9px;background:var(--panel2);font-size:12px}.risk.warn{color:#f5c473;background:rgba(242,184,75,.09)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.open{display:flex}.sheet{width:min(1120px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px}.section{margin-top:18px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}.details,.strategy-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.detail,.strategy-card{background:var(--panel2);border-radius:10px;padding:11px;min-width:0}.detail b{display:block;overflow-wrap:anywhere}.strategy-card{border:1px solid transparent}.strategy-card:first-child{border-color:rgba(56,103,239,.6)}.strategy-card strong{display:block;font-size:15px;margin:4px 0}.strategy-card p{margin:7px 0 0;font-size:11px;color:var(--muted)}.model-note{border:1px solid rgba(242,184,75,.28);background:rgba(242,184,75,.07);color:#eac57c;padding:10px 12px;border-radius:9px;font-size:12px}.policy{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}.policy label{font-size:11px;color:var(--muted)}.policy select,.policy input{display:block;width:100%;margin-top:4px;background:#0c0c0f;border:1px solid var(--line);color:#fff;padding:9px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px}th{color:var(--muted);font-size:10px;text-transform:uppercase}.notice{padding:24px;text-align:center;color:var(--muted)}@media(max-width:800px){.tiles{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.details,.policy,.strategy-grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.top{padding:12px 14px}}@media(max-width:480px){.details,.policy,.strategy-grid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.actions .sub{display:none}}
</style></head>
<body>
<header class="top"><div><h1>IPFX Team · Trader Analytics</h1><div class="sub" id="status">Secure team view · loading</div></div><div class="actions"><a class="btn" href="admin.html">Operations</a><button class="btn" onclick="load()">Refresh</button></div></header>
<main class="wrap"><div class="tiles" id="tiles"></div><div class="toolbar"><input id="search" placeholder="Search trader, email, account or challenge…" oninput="render()"><button class="chip on" data-cat="all" onclick="pick('all',this)">All</button><button class="chip" data-cat="scalper" onclick="pick('scalper',this)">Scalpers</button><button class="chip" data-cat="news_event_trader" onclick="pick('news_event_trader',this)">News event</button><button class="chip" data-cat="swing_trader" onclick="pick('swing_trader',this)">Swing</button><button class="chip" data-cat="high_frequency_trader" onclick="pick('high_frequency_trader',this)">High frequency</button><button class="chip" data-cat="unclassified" onclick="pick('unclassified',this)">Unclassified</button></div><div id="grid" class="grid"><div class="notice">Loading every account…</div></div></main>
<div class="modal" id="modal"><div class="sheet"><div class="row"><div><div class="name" id="dName">Trader</div><div class="muted" id="dEmail"></div></div><div class="actions"><button class="btn primary" id="syncerButton" onclick="openConnect(selected.account_id)">Connect TradeLocker demo</button><button class="btn" onclick="closeDetail()">Close</button></div></div><div class="sub" id="syncerStatus" aria-live="polite"></div><div id="detail"><div class="notice">Loading protected details…</div></div></div></div>
<script>
const SB_URL='https://agulweemteoeagscmppy.supabase.co',SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFndWx3ZWVtdGVvZWFnc2NtcHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MzU0ODIsImV4cCI6MjA4MTQxMTQ4Mn0.I70jN5DCuCn8OtISqvTRzuzGFaYd2pV8vviEED6gFlQ',FN=SB_URL+'/functions/v1/admin-console',TL_FN=SB_URL+'/functions/v1/tradelocker-connect';
const sb=window.supabase.createClient(SB_URL,SB_ANON);let rows=[],filter='all',selected=null;
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('en-GB',{style:'currency',currency:'USD',maximumFractionDigits:2});
const pct=v=>v==null?'—':Number(v).toFixed(1)+'%';
async function call(body){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=trader-analytics.html';return null}const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok||j.ok===false){document.getElementById('status').textContent=j.error||'Request failed';throw new Error(j.error||'Request failed')}return j}
function label(c){return({scalper:'Scalper',news_event_trader:'News event trader',swing_trader:'Swing trader',high_frequency_trader:'High-frequency trader',unclassified:'Unclassified'})[c]||c}
function familyLabel(c){return({trend_following:'Trend following',mean_reversion:'Mean reversion',breakout:'Breakout / volatility expansion',vwap_scalping:'VWAP scalping',news_event:'News-event trading',swing_trend:'Swing trend'})[c]||c}
function indicatorLabel(id){return String(id||'').split('@')[0].replace('MAExp','EMA').replace('MASimple','SMA')}
let refreshing=false;
async function load(silent=false){if(refreshing)return;refreshing=true;if(!silent)document.getElementById('grid').innerHTML='<div class="notice">Calculating trader styles and risk evidence…</div>';try{const j=await call({action:'risk_analytics'});if(!j)return;rows=j.rows||[];document.getElementById('status').textContent=`Owner-only · MFA protected · ${j.macro_provider} · updated ${new Date(j.calculated_at).toLocaleString('en-GB')}`;const c=j.category_counts||{};document.getElementById('tiles').innerHTML=`<div class="tile"><span class="k">All accounts</span><b>${rows.length}</b></div><div class="tile"><span class="k">Scalpers</span><b>${c.scalper||0}</b></div><div class="tile"><span class="k">News event</span><b>${c.news_event_trader||0}</b></div><div class="tile"><span class="k">Swing</span><b>${c.swing_trader||0}</b></div><div class="tile"><span class="k">High frequency</span><b>${c.high_frequency_trader||0}</b></div>`;if(selected)selected=rows.find(r=>r.account_id===selected.account_id)||selected;render()}catch(e){if(!silent)document.getElementById('grid').innerHTML=`<div class="notice">${esc(e.message)}<br><br>This page requires the configured owner email and an MFA-verified session.</div>`}finally{refreshing=false}}
function pick(cat,el){filter=cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('on',x===el));render()}
function render(){const q=document.getElementById('search').value.toLowerCase();const visible=rows.filter(r=>(filter==='all'||r.category===filter)&&[r.full_name,r.email,r.account_id,r.challenge_type,r.label].join(' ').toLowerCase().includes(q));document.getElementById('grid').innerHTML=visible.map(r=>{const p=r.profile||{},profit=Number(r.balance)-Number(r.starting_balance),ret=r.starting_balance?profit/Number(r.starting_balance)*100:0,last=r.last_decision,flagCount=(r.open_flags||[]).length;return`<article class="card" onclick="openDetail('${esc(r.account_id)}')"><div class="row"><div><div class="name">${esc(r.full_name)}</div><div class="muted">${esc(r.email)} · ${esc(r.label||r.challenge_type)}</div></div><span class="badge ${esc(r.category)}">${esc(label(r.category))}</span></div><div class="pnl ${profit>=0?'pos':'neg'}">${money(profit)} <span style="font-size:13px">${ret>=0?'+':''}${ret.toFixed(2)}%</span></div><div class="kpis"><div><span>Trades</span><b>${p.trades_closed||0}</b></div><div><span>Win rate</span><b>${pct(p.win_rate)}</b></div><div><span>Profit factor</span><b>${p.profit_factor??'—'}</b></div><div><span>Avg hold</span><b>${p.hold_time?Math.round(p.hold_time.avg_minutes)+'m':'—'}</b></div></div><div class="risk ${flagCount?'warn':''}">${flagCount?flagCount+' open risk flag'+(flagCount===1?'':'s'):last?`Last IPFX copy: ${esc(last.action)} · ${Number(last.risk_multiplier).toFixed(2)}×`:'No copy decision yet'} · policy ${esc(r.policy.mode)}</div><button class="btn primary" style="margin-top:10px" onclick="event.stopPropagation();openConnect('${esc(r.account_id)}')">Connect demo</button></article>`}).join('')||'<div class="notice">No accounts match this view.</div>'}
async function openDetail(id){selected=rows.find(r=>r.account_id===id);if(!selected)return;document.getElementById('modal').classList.add('open');document.getElementById('dName').textContent=selected.full_name;document.getElementById('dEmail').textContent=selected.email+' · '+selected.account_id;document.getElementById('detail').innerHTML='<div class="notice">Loading protected identity and full analytics…</div>';try{const j=await call({action:'trader_detail',user_id:selected.user_id});renderDetail(j)}catch(e){document.getElementById('detail').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function renderDetail(j){
  const r=selected,p=r.profile||{},i=j.identity||{},e=r.category_evidence||{},pol=r.policy||{};
  const name=[i.legal_first_name,i.legal_middle_names,i.legal_last_name].filter(Boolean).join(' ')||j.full_name;
  const addr=[i.address_line_1,i.address_line_2,i.city,i.region,i.postal_code,i.country_code].filter(Boolean).join(', ');
  const flags=(r.open_flags||[]).map(f=>`<tr><td>${esc(f.reason)}</td><td>${new Date(f.created_at).toLocaleString('en-GB')}</td><td>Open</td></tr>`).join('');
  const decisions=(r.risk_decisions||[]).map(d=>`<tr><td>${new Date(d.created_at).toLocaleString('en-GB')}</td><td>${esc(d.action)}</td><td>${Number(d.risk_multiplier).toFixed(2)}×</td><td>${esc((d.reasons||[]).join('; '))}</td></tr>`).join('');
  const allHyp=(j.strategy_hypotheses||[]).filter(h=>h.account_id===r.account_id),latestCutoff=allHyp[0]&&allHyp[0].cutoff_date;
  const hypotheses=allHyp.filter(h=>h.cutoff_date===latestCutoff).slice(0,3),studies=(j.chart_layout&&j.chart_layout.studies)||[];
  const hypothesisHtml=hypotheses.map((h,idx)=>`<div class="strategy-card"><span class="k">${idx===0?'Leading theory':'Alternative theory'}</span><strong>${esc(familyLabel(h.family))} · ${pct(Number(h.confidence)*100)}</strong><div class="muted">${esc((h.evidence&&h.evidence.closed_trades)||0)} closed trades · cutoff ${esc(h.cutoff_date)}</div><p>${(h.contradictions||[]).length?'Contradiction: '+esc(h.contradictions.join('; ')):'No material contradiction recorded in this run.'}</p></div>`).join('');
  const plans=(j.paper_plans||[]).filter(x=>x.account_id===r.account_id).slice(0,10).map(x=>`<tr><td>${esc(x.prediction_day)}</td><td>${esc(familyLabel(x.family))}</td><td>${esc(x.predicted_symbol)} · ${esc(x.predicted_side)} · ${esc(x.predicted_session)} · ${Number(x.predicted_trade_count||0).toFixed(1)} trades</td><td>${x.status==='compared'?Number(x.comparison_score).toFixed(1)+'%':esc(x.status.replaceAll('_',' '))}</td></tr>`).join('');
  document.getElementById('detail').innerHTML=`<div class="section"><h3>Protected identity</h3><div class="details"><div class="detail"><span class="k">Trader ID</span><b class="mono">${esc(j.user_id)}</b></div><div class="detail"><span class="k">Legal name</span><b>${esc(name)}</b></div><div class="detail"><span class="k">DOB</span><b>${esc(i.date_of_birth)}</b></div><div class="detail"><span class="k">Phone</span><b>${esc(i.phone_e164)}</b></div><div class="detail" style="grid-column:span 2"><span class="k">Address</span><b>${esc(addr)}</b></div><div class="detail"><span class="k">Nationality</span><b>${esc(i.nationality_code)}</b></div><div class="detail"><span class="k">Country</span><b>${esc(i.country_code)}</b></div></div></div><div class="section"><h3>Classification evidence</h3><div class="details"><div class="detail"><span class="k">Group</span><b>${esc(label(r.category))}</b></div><div class="detail"><span class="k">Confidence</span><b>${pct(Number(r.category_confidence)*100)}</b></div><div class="detail"><span class="k">Trades / active day</span><b>${esc(e.trades_per_active_day)}</b></div><div class="detail"><span class="k">Median hold</span><b>${esc(e.median_hold_minutes)} min</b></div><div class="detail"><span class="k">News-window trades</span><b>${esc(e.news_event_trades)} (${pct(Number(e.news_event_ratio||0)*100)})</b></div><div class="detail"><span class="k">Win rate</span><b>${pct(p.win_rate)}</b></div><div class="detail"><span class="k">Profit factor</span><b>${p.profit_factor??'—'}</b></div><div class="detail"><span class="k">Consistency</span><b>${pct(p.consistency_pct)}</b></div></div></div><div class="section"><h3>Strategy laboratory</h3><div class="model-note">Research hypothesis, not proof. The system uses trade timing, instruments, size, stop/target placement and saved chart indicators. It creates demo-only paper plans; it never places a live trade and never decides challenge access, failure, payout or discipline.</div><p class="muted">Observed chart setup: ${studies.length?studies.map(indicatorLabel).map(esc).join(', '):'No authenticated indicator evidence captured yet'}${j.chart_layout?' · '+esc(j.chart_layout.timeframe)+' timeframe':''}</p><div class="strategy-grid">${hypothesisHtml||'<div class="strategy-card"><strong>Insufficient evidence</strong><p>At least eight valid closed trades are required before the system publishes a theory.</p></div>'}</div><h3 style="margin-top:16px">Demo comparison history</h3><table><thead><tr><th>Prediction day</th><th>Theory</th><th>Paper plan</th><th>Out-of-sample match</th></tr></thead><tbody>${plans||'<tr><td colspan="4" class="muted">The first daily paper plan is waiting for a later trading day to compare.</td></tr>'}</tbody></table></div><div class="section"><h3>IPFX own-account copy policy</h3><div class="policy"><label>Mode<select id="pMode"><option value="observe">Observe only</option><option value="adaptive">Adaptive sizing</option><option value="blocked">Do not copy new trades</option></select></label><label>Minimum size<input id="pMin" type="number" step="0.01" min="0.01" max="1" value="${Number(pol.min_multiplier??.1)}"></label><label>Unusual at multiple<input id="pUnusual" type="number" step="0.1" min="1.5" max="20" value="${Number(pol.unusual_size_multiple??3)}"></label><label>High-impact news size<input id="pNews" type="number" step="0.05" min="0" max="1" value="${Number(pol.news_multiplier??.25)}"></label></div><p class="muted">Observe records recommendations without changing size. Adaptive can reduce or skip IPFX's own copy. Blocked stops new copies; closing orders always remain enabled.</p><button class="btn primary" onclick="savePolicy()">Save policy</button></div><div class="section"><h3>Open unusual-trade flags</h3><table><thead><tr><th>Reason</th><th>Detected</th><th>Status</th></tr></thead><tbody>${flags||'<tr><td colspan="3" class="muted">No open flags</td></tr>'}</tbody></table></div><div class="section"><h3>Recent IPFX copy decisions</h3><table><thead><tr><th>Time</th><th>Action</th><th>Size</th><th>Evidence</th></tr></thead><tbody>${decisions||'<tr><td colspan="4" class="muted">No decisions yet</td></tr>'}</tbody></table></div>`;
  document.getElementById('pMode').value=pol.mode||'observe';
}
async function savePolicy(){const body={action:'risk_policy_update',user_id:selected.user_id,mode:document.getElementById('pMode').value,min_multiplier:Number(document.getElementById('pMin').value),unusual_size_multiple:Number(document.getElementById('pUnusual').value),news_multiplier:Number(document.getElementById('pNews').value)};try{const j=await call(body);selected.policy=j.policy;alert('Risk policy saved. It applies only to IPFX own-account copies.')}catch(e){alert(e.message)}}
async function tlCall(body){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sign in again');const r=await fetch(TL_FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Invalid connector response'}));if(!r.ok||j.ok===false)throw new Error(j.error||'Connection failed');return j}
async function openConnect(id){selected=rows.find(r=>r.account_id===id)||selected;if(!selected)return;document.getElementById('modal').classList.add('open');document.getElementById('dName').textContent=selected.full_name;document.getElementById('dEmail').textContent=selected.email+' · '+selected.account_id;document.getElementById('syncerStatus').textContent='Checking TradeLocker demo connection…';document.getElementById('detail').innerHTML=`<div class="section"><h3>TradeLocker demo destination</h3><div class="model-note">Demo only. Your password is sent once to TradeLocker for authentication and is never stored by IPFX. Connecting enables one-for-one copying to this demo only. Live-capital destinations remain controlled by the evidence, consent, reserve and broker-risk gates.</div><form id="tlForm" class="policy" style="margin-top:14px" onsubmit="connectTradeLocker(event)"><label>TradeLocker email<input id="tlEmail" type="email" autocomplete="username" required></label><label>Password<input id="tlPassword" type="password" autocomplete="current-password" required></label><label>Server<input id="tlServer" placeholder="Exact demo server name" required></label><label>Account ID (number after #)<input id="tlAccountId" type="text" inputmode="numeric" pattern="[0-9]{1,20}" required></label><button class="btn primary" id="tlConnect" type="submit">Connect demo safely</button></form><div class="actions" style="margin-top:12px"><button class="btn" onclick="disconnectTradeLocker()">Disconnect</button></div></div>`;try{const j=await tlCall({action:'status',source_user_id:selected.user_id,source_account_id:selected.account_id});const c=j.connection;if(c){document.getElementById('tlServer').value=c.server||'';document.getElementById('tlAccountId').value=c.tradelocker_account_id||'';document.getElementById('syncerStatus').textContent=`${j.connected?'Connected':'Not connected'} · ${j.armed?'Armed':'Disarmed'} · ${c.account_name||'Demo account'}`}else document.getElementById('syncerStatus').textContent='Not connected'}catch(e){document.getElementById('syncerStatus').textContent=e.message}}
async function connectTradeLocker(event){event.preventDefault();const b=document.getElementById('tlConnect');b.disabled=true;b.textContent='Validating with TradeLocker…';try{const j=await tlCall({action:'connect',source_user_id:selected.user_id,source_account_id:selected.account_id,email:document.getElementById('tlEmail').value.trim(),password:document.getElementById('tlPassword').value,server:document.getElementById('tlServer').value.trim(),tradelocker_account_id:document.getElementById('tlAccountId').value.trim()});document.getElementById('tlPassword').value='';document.getElementById('syncerStatus').textContent=`Connected · demo ready · ${j.instrument_count} instruments mapped.`}catch(e){document.getElementById('syncerStatus').textContent=e.message}finally{b.disabled=false;b.textContent='Connect demo safely'}}
async function disconnectTradeLocker(){if(!selected||!confirm('Disconnect this demo destination and disable new copied trades?'))return;try{await tlCall({action:'disconnect',source_user_id:selected.user_id,source_account_id:selected.account_id});document.getElementById('syncerStatus').textContent='Disconnected and disarmed.'}catch(e){document.getElementById('syncerStatus').textContent=e.message}}function closeDetail(){document.getElementById('modal').classList.remove('open');document.getElementById('syncerStatus').textContent=''}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDetail()});load();setInterval(()=>{if(document.visibilityState==='visible')load(true)},10000);
</script></body></html>
