<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | IPFX Capital</title>
  <meta name="description" content="The requested IPFX Capital page could not be found.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/assets/css/site-foundation.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f8fafc; background: #080a0e; font-family: Inter, system-ui, sans-serif; }
    main { width: min(680px, calc(100% - 36px)); padding: 64px 0; text-align: center; }
    .mark { width: 54px; height: 54px; margin: 0 auto 26px; }
    .code { color: #60a5fa; font-size: 13px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 12px 0; font-size: clamp(34px, 7vw, 64px); letter-spacing: 0; }
    p { margin: 0 auto 28px; max-width: 520px; color: #9ca3af; font-size: 17px; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .actions a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 16px; border: 1px solid #343945; border-radius: 5px; color: #fff; text-decoration: none; font-weight: 700; }
    .actions a:first-child { border-color: #2563eb; background: #2563eb; }
  </style>
</head>
<body>
  <main id="main-content">
    <img class="mark" src="/favicon/android-chrome-192x192.png" alt="IPFX Capital logo">
    <div class="code">ERROR 404</div>
    <h1>Page not found</h1>
    <p>The address may be outdated or the page may have moved. Return to the main site or contact support if you expected something to be here.</p>
    <div class="actions">
      <a href="/">Return home</a>
      <a href="/contact.html">Contact support</a>
    </div>
  </main>
  <script defer src="/assets/js/site-foundation.js"></script>
</body>
</html>
